# gitleaks configuration (OPS-02). The same base is used in all six Lumina repos; only the
# repo-specific allowlists at the end differ. CI (.github/workflows) runs `gitleaks git` over the
# full history with --redact and a pinned, sha256-verified gitleaks, after a self-test that proves
# this file still catches a fake key and still ignores a plain address.
title = "lumina-core"

[extend]
# Start from gitleaks' built-in rules.
useDefault = true

# EVM private key: 64 hex characters, with or without 0x, right after a name containing
# key / private / secret / mnemonic / seed / pk, e.g. `PRIVATE_KEY=0x…`, `"privateKey": "…"`,
# `deployer_pk: …`, `--private-key 0x…`. No entropy floor: a low-entropy key is still a key.
[[rules]]
id = "evm-private-key"
description = "EVM private key (32 bytes of hex) assigned to a key/secret-like name"
regex = '''(?i)(?:key|private|secret|mnemonic|seed|pk)[a-z0-9_.\-]{0,32}["'`]?\s*(?::=|=>|[:=,(]|\s)\s*["'`]?((?:0x)?[0-9a-f]{64})(?:[^0-9a-z]|$)'''
secretGroup = 1
keywords = ["key", "private", "secret", "mnemonic", "seed", "pk"]

# A bare 20-byte EVM address is public data. The regex is anchored and tested against the
# extracted secret only, so a 32-byte key (which contains many 40-hex substrings) is never
# allowlisted. Do not unanchor it: the old `0x[a-fA-F0-9]{40}` allowlisted leaked keys.
[[allowlists]]
description = "Public 20-byte EVM addresses (exact match only)"
regexTarget = "secret"
regexes = ['''^0x[a-fA-F0-9]{40}$''']

# ---- lumina-core only: upstream Aave v3.2 history (2024 commits by Aave/BGD, before the fork).
# Each entry is narrowed to one rule and one path set; nothing here can hide a key elsewhere.

[[allowlists]]
description = "Upstream Aave: Certora prover report links (anonymousKey= view tokens) in spec comments"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^certora/.*\.spec$''']
regexTarget = "match"
regexes = ['''^anonymousKey=''']

[[allowlists]]
description = "Upstream Aave: Solidity identifiers and the ERC-7201 storage slot constant matched by generic-api-key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  # periphery/contracts/... before the upstream move, contracts/extensions/... in upstream merges
  '''^src/(periphery/contracts|contracts/extensions)/static-a-token/ERC4626StataTokenUpgradeable\.sol$''',
  '''^src/(periphery/contracts|contracts/extensions)/static-a-token/interfaces/IStataTokenV2\.sol$''',
  '''^tests/core/ATokenRepay\.t\.sol$''',
]
regexTarget = "secret"
regexes = [
  '''^0x55029d3f54709e547ed74b2fc842d93107ab1490ab7555dd9dd0bf6451101900$''',
  '''^IERC20AaveLM$''',
  '''^IERC20Detailed$''',
]

[[allowlists]]
description = "forge-std's own test vectors (public test keys), vendored in the upstream initial commit"
targetRules = ["evm-private-key"]
paths = ['''^lib/(solidity-utils/lib/)?forge-std/test/StdCheats\.t\.sol$''']
